<ion-content class="admin-content">
  <section class="hero-panel">
    <div>
      <ion-row>
        <ion-col size="6">
                        <p class="eyebrow">Admin Control Center</p>

        </ion-col>
         <ion-col size="6" style="text-align: right;">
                        <u><p style=" margin: 0 0 8px; color: brown; cursor: pointer; letter-spacing: .08em; text-transform: uppercase;  " (click)="openRoute('/member-dashboard')">Mark Own Attendance</p></u>

        </ion-col>
      </ion-row>
     
      <!-- <h1>Manage attendance, leave counts, and team visibility from one place.</h1> -->
      <!-- <p class="hero-copy">
        Quickly open member details, monthly leave summaries, and the live attendance history view.
      </p> -->
      <!-- <ion-button  fill="clear" class="mark-attenence" (click)="openRoute('/member-dashboard')">Mark Own Attendance</ion-button> -->
    </div>
  </section>

  <section class="dashboard-grid">
    <button
      type="button"
      class="action-card"
      *ngFor="let action of quickActions"
      [ngClass]="action.accent"
      (click)="openRoute(action.route)"
    >
      <div class="action-icon">
        <ion-icon [name]="action.icon"></ion-icon>
      </div>
      <div class="action-copy">
        <h3>{{ action.title }}</h3>
        <p>{{ action.description }}</p>
      </div>
      <ion-icon class="chevron" name="chevron-forward-outline"></ion-icon>
    </button>
  </section>
